<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>PTK Motos · Financeiro</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:#f7f7f7;min-height:100vh;padding-bottom:70px}
input,select,textarea{font-family:inherit;font-size:16px!important}
button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
@media(max-width:600px){.grid2{grid-template-columns:1fr!important}.grid3{grid-template-columns:1fr 1fr!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect}=React;
const SB=supabase.createClient("https://mvfuquomyxbtdaywrhmy.supabase.co","sb_publishable_nt9279fkfL4mJxp8v7xfyg__phGzWkP");
async function ler(){const{data,error}=await SB.from("colecoes").select("dados").eq("nome","caixa").maybeSingle();if(error)throw error;const v=data?.dados||{};return{contas:v.contas||[],lancamentos:v.lancamentos||[],despesas:v.despesas||[]};}
async function gravar(dados){const{error}=await SB.from("colecoes").upsert({nome:"caixa",dados});if(error)throw error;}
const fm=v=>Number(v||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const fd=d=>d?new Date(d+"T12:00:00").toLocaleDateString("pt-BR"):"—";
const td=()=>{const n=new Date();return n.getFullYear()+"-"+String(n.getMonth()+1).padStart(2,"0")+"-"+String(n.getDate()).padStart(2,"0");};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mesAtual=()=>td().slice(0,7);
const mesNome=m=>{const[y,mo]=m.split("-");return new Date(Number(y),Number(mo)-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"}).replace(/^./,x=>x.toUpperCase());};
const mesSoma=(m,n)=>{const[y,mo]=m.split("-").map(Number);const d=new Date(y,mo-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");};
const CAT_ENT=["Venda de moto","Sinal / entrada","Servico","Aporte socios","Emprestimo recebido","Outros"];
const CAT_SAI=["Compra de moto","Despesa fixa","Reforma / pecas","Documentacao","Anuncios","Salarios / comissoes","Impostos","Retirada socios","Outros"];
const lb={fontSize:11,fontWeight:700,color:"#666",textTransform:"uppercase",letterSpacing:".5px"};
const ip={border:"1.5px solid #ddd",borderRadius:10,padding:"10px 12px",fontSize:16,outline:"none",background:"#fafafa",width:"100%",boxSizing:"border-box",WebkitAppearance:"none"};
const card={background:"#fff",border:"1.5px solid #eee",borderRadius:14,padding:16};
const Fi=({label,...p})=>(<div style={{display:"flex",flexDirection:"column",gap:5}}><label style={lb}>{label}</label><input {...p} style={{...ip,...p.style}}/></div>);
const Se=({label,children,...p})=>(<div style={{display:"flex",flexDirection:"column",gap:5}}><label style={lb}>{label}</label><select {...p} style={{...ip,...p.style}}>{children}</select></div>);
const Btn=({onClick,label,color,full,disabled})=>(<button onClick={onClick} disabled={disabled} style={{padding:"12px 20px",border:"none",borderRadius:10,background:disabled?"#ccc":color||"#c62828",color:"#fff",fontWeight:700,cursor:disabled?"not-allowed":"pointer",fontSize:14,width:full?"100%":"auto"}}>{label}</button>);
const Tit=({children})=>(<p style={{margin:"0 0 12px",fontWeight:700,fontSize:14}}>{children}</p>);

function Login({onLogin}){
  const[email,setEmail]=useState("");const[senha,setSenha]=useState("");const[erro,setErro]=useState("");const[show,setShow]=useState(false);const[ent,setEnt]=useState(false);
  const tentar=async()=>{if(!email||!senha){setErro("Informe e-mail e senha.");return;}setEnt(true);setErro("");const{error}=await SB.auth.signInWithPassword({email:email.trim(),password:senha});setEnt(false);if(error){setErro("E-mail ou senha incorretos.");return;}onLogin();};
  return(<div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"#c62828",padding:24}}>
    <div style={{background:"#fff",borderRadius:24,padding:32,width:"100%",maxWidth:380,boxShadow:"0 8px 40px #0003"}}>
      <div style={{textAlign:"center",marginBottom:28}}><span style={{fontSize:56}}>💵</span><p style={{margin:"10px 0 4px",fontWeight:900,fontSize:24,color:"#c62828"}}>PTK FINANCEIRO</p><p style={{margin:0,fontSize:13,color:"#888"}}>Entradas, saidas e contas</p></div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <input type="email" value={email} onChange={e=>{setEmail(e.target.value);setErro("");}} placeholder="Seu e-mail" autoCapitalize="none" autoComplete="username" style={ip}/>
        <div style={{position:"relative"}}>
          <input type={show?"text":"password"} value={senha} onChange={e=>{setSenha(e.target.value);setErro("");}} onKeyDown={e=>e.key==="Enter"&&tentar()} placeholder="Sua senha" autoComplete="current-password" style={{...ip,paddingRight:48}}/>
          <button onClick={()=>setShow(!show)} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",border:"none",background:"none",cursor:"pointer",fontSize:18,color:"#aaa"}}>{show?"🙈":"👁️"}</button>
        </div>
        {erro&&<p style={{margin:0,color:"#b71c1c",fontSize:13,fontWeight:600}}>{erro}</p>}
        <button onClick={tentar} style={{padding:"14px",border:"none",borderRadius:12,background:"#c62828",color:"#fff",fontWeight:800,cursor:"pointer",fontSize:16}} disabled={ent}>{ent?"Entrando...":"Entrar"}</button>
      </div>
      <p style={{textAlign:"center",margin:"20px 0 0",fontSize:12}}><a href="./" style={{color:"#aaa"}}>Voltar ao sistema</a></p>
    </div>
  </div>);}

function saldoConta(c,lancs){return lancs.reduce((s,l)=>{const v=Number(l.valor||0);
  if(l.tipo==="Entrada"&&l.contaId===c.id)return s+v;
  if(l.tipo==="Saida"&&l.contaId===c.id)return s-v;
  if(l.tipo==="Transferencia"){if(l.contaId===c.id)return s-v;if(l.contaDestinoId===c.id)return s+v;}
  return s;},Number(c.saldoInicial||0));}

function NovoLanc({contas,onAdd}){
  const[tipo,setTipo]=useState("Entrada");const[valor,setValor]=useState("");const[desc,setDesc]=useState("");
  const[contaId,setContaId]=useState(contas[0]?.id||"");const[destino,setDestino]=useState(contas[1]?.id||"");
  const[cat,setCat]=useState(CAT_ENT[0]);const[data,setData]=useState(td());
  const mudaTipo=t=>{setTipo(t);setCat(t==="Entrada"?CAT_ENT[0]:t==="Saida"?CAT_SAI[0]:"Transferencia");};
  const add=()=>{
    if(!valor||Number(valor)<=0){alert("Informe o valor.");return;}
    if(!contaId){alert("Escolha a conta.");return;}
    if(tipo==="Transferencia"&&(!destino||destino===contaId)){alert("Escolha uma conta de destino diferente.");return;}
    onAdd({id:uid(),tipo,valor:Number(valor),desc:desc||cat,contaId,contaDestinoId:tipo==="Transferencia"?destino:null,cat,data});
    setValor("");setDesc("");};
  const cores={Entrada:"#2e7d32",Saida:"#c62828",Transferencia:"#1565c0"};
  return(<div style={card}>
    <Tit>+ Novo lancamento</Tit>
    <div style={{display:"flex",gap:6,marginBottom:12}}>
      {["Entrada","Saida","Transferencia"].map(t=>(<button key={t} onClick={()=>mudaTipo(t)} style={{flex:1,padding:"10px 4px",border:"1.5px solid",borderColor:tipo===t?cores[t]:"#ddd",borderRadius:10,background:tipo===t?cores[t]:"#fff",color:tipo===t?"#fff":"#555",fontWeight:700,fontSize:13,cursor:"pointer"}}>{t==="Entrada"?"↑ Entrada":t==="Saida"?"↓ Saida":"⇄ Transferir"}</button>))}
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}} className="grid2">
      <Fi label="Valor R$" type="number" value={valor} onChange={e=>setValor(e.target.value)} inputMode="decimal"/>
      <Fi label="Data" type="date" value={data} onChange={e=>setData(e.target.value)}/>
      <Se label={tipo==="Transferencia"?"Sai da conta":"Conta"} value={contaId} onChange={e=>setContaId(e.target.value)}>{contas.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</Se>
      {tipo==="Transferencia"
        ?<Se label="Vai para a conta" value={destino} onChange={e=>setDestino(e.target.value)}><option value="">Selecionar...</option>{contas.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</Se>
        :<Se label="Categoria" value={cat} onChange={e=>setCat(e.target.value)}>{(tipo==="Entrada"?CAT_ENT:CAT_SAI).map(c=><option key={c}>{c}</option>)}</Se>}
      <div style={{gridColumn:"1/-1"}}><Fi label="Descricao" value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Ex: Venda CG 160 placa ABC1234"/></div>
    </div>
    <div style={{marginTop:12}}><Btn onClick={add} label="Salvar lancamento" color={cores[tipo]} full/></div>
  </div>);}

function Extrato({lancs,contas,onRem}){
  const nomeConta=id=>(contas.find(c=>c.id===id)||{}).nome||"(conta removida)";
  return(<div style={{...card,padding:0,overflow:"hidden"}}>
    <p style={{margin:0,padding:"14px 16px",fontWeight:700,fontSize:14,borderBottom:"1px solid #eee"}}>Extrato do mes</p>
    {lancs.length===0&&<p style={{padding:20,color:"#aaa",fontSize:14,textAlign:"center"}}>Nenhum lancamento neste mes.</p>}
    {lancs.map(l=>{const cor=l.tipo==="Entrada"?"#2e7d32":l.tipo==="Saida"?"#c62828":"#1565c0";const sinal=l.tipo==="Entrada"?"+":l.tipo==="Saida"?"-":"";
      return(<div key={l.id} style={{display:"flex",alignItems:"center",gap:10,padding:"12px 16px",borderBottom:"1px solid #f5f5f5"}}>
        <span style={{fontSize:18,color:cor,width:20,textAlign:"center"}}>{l.tipo==="Entrada"?"↑":l.tipo==="Saida"?"↓":"⇄"}</span>
        <div style={{flex:1,minWidth:0}}><p style={{margin:0,fontSize:14,fontWeight:600}}>{l.desc}</p>
          <p style={{margin:0,fontSize:12,color:"#aaa"}}>{fd(l.data)} · {l.tipo==="Transferencia"?nomeConta(l.contaId)+" → "+nomeConta(l.contaDestinoId):l.cat+" · "+nomeConta(l.contaId)}</p></div>
        <span style={{fontWeight:700,fontSize:14,color:cor,whiteSpace:"nowrap"}}>{sinal}{fm(l.valor)}</span>
        <button onClick={()=>{if(confirm("Excluir este lancamento?"))onRem(l.id);}} style={{border:"none",background:"none",color:"#ccc",cursor:"pointer",fontSize:20,padding:"4px 8px"}}>✕</button>
      </div>);})}
  </div>);}

function Despesas({despesas,lancs,contas,mes,onPagar,onSalvar,resumo}){
  const[pagando,setPagando]=useState(null);const[pv,setPv]=useState("");const[pc,setPc]=useState("");const[pd,setPd]=useState(td());
  const[nome,setNome]=useState("");const[valor,setValor]=useState("");const[dia,setDia]=useState("");
  const pagoEm=d=>lancs.find(l=>l.despesaId===d.id&&l.mes===mes);
  const lista=[...despesas].sort((a,b)=>Number(a.dia||99)-Number(b.dia||99));
  const total=lista.reduce((s,d)=>s+Number(d.valor||0),0);
  const pago=lista.filter(pagoEm).reduce((s,d)=>s+Number(pagoEm(d).valor||0),0);
  const abrir=d=>{setPagando(d.id);setPv(String(d.valor||""));setPc(contas[0]?.id||"");setPd(td());};
  const confirmar=d=>{if(!pv||!pc){alert("Informe valor e conta.");return;}onPagar({id:uid(),tipo:"Saida",valor:Number(pv),desc:d.nome,contaId:pc,cat:"Despesa fixa",data:pd,despesaId:d.id,mes});setPagando(null);};
  const add=()=>{if(!nome){alert("Informe o nome da conta.");return;}onSalvar([...despesas,{id:uid(),nome,valor:Number(valor||0),dia:dia?Number(dia):null}]);setNome("");setValor("");setDia("");};
  const rem=d=>{if(confirm("Remover \""+d.nome+"\" da lista de contas principais?"))onSalvar(despesas.filter(x=>x.id!==d.id));};
  return(<div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{...card,padding:0,overflow:"hidden"}}>
      <div style={{padding:"14px 16px",borderBottom:"1px solid #eee",display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
        <p style={{margin:0,fontWeight:700,fontSize:14}}>Contas principais · {mesNome(mes)}</p>
        <span style={{fontSize:12,color:"#888",whiteSpace:"nowrap"}}>Pago {fm(pago)} de {fm(total)}</span>
      </div>
      {lista.length===0&&<p style={{padding:20,color:"#aaa",fontSize:14,textAlign:"center"}}>Nenhuma conta principal cadastrada.{resumo?"":" Adicione abaixo."}</p>}
      {lista.map(d=>{const p=pagoEm(d);const atrasada=!p&&d.dia&&mes===mesAtual()&&Number(d.dia)<new Date().getDate();
        return(<div key={d.id} style={{padding:"12px 16px",borderBottom:"1px solid #f5f5f5"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:18}}>{p?"✅":atrasada?"⚠️":"⏳"}</span>
            <div style={{flex:1,minWidth:0}}><p style={{margin:0,fontSize:14,fontWeight:600}}>{d.nome}</p>
              <p style={{margin:0,fontSize:12,color:p?"#2e7d32":atrasada?"#c62828":"#aaa"}}>{p?"Pago em "+fd(p.data)+" · "+fm(p.valor):(d.dia?"Vence dia "+d.dia:"Sem dia fixo")+(atrasada?" · atrasada":"")}</p></div>
            <span style={{fontWeight:700,fontSize:14,whiteSpace:"nowrap"}}>{fm(d.valor)}</span>
            {!p&&pagando!==d.id&&<button onClick={()=>abrir(d)} style={{border:"none",borderRadius:8,background:"#2e7d32",color:"#fff",fontWeight:700,fontSize:12,padding:"7px 12px",cursor:"pointer"}}>Pagar</button>}
            {!resumo&&<button onClick={()=>rem(d)} style={{border:"none",background:"none",color:"#ccc",cursor:"pointer",fontSize:20,padding:"4px 8px"}}>✕</button>}
          </div>
          {pagando===d.id&&(<div style={{marginTop:10,display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,alignItems:"end"}} className="grid3">
            <Fi label="Valor pago" type="number" value={pv} onChange={e=>setPv(e.target.value)} inputMode="decimal"/>
            <Se label="Pago com" value={pc} onChange={e=>setPc(e.target.value)}>{contas.map(c=><option key={c.id} value={c.id}>{c.nome}</option>)}</Se>
            <Fi label="Data" type="date" value={pd} onChange={e=>setPd(e.target.value)}/>
            <div style={{gridColumn:"1/-1",display:"flex",gap:8}}>
              <button onClick={()=>setPagando(null)} style={{flex:1,padding:"10px",border:"1.5px solid #ddd",borderRadius:10,background:"#fff",cursor:"pointer",fontWeight:600}}>Cancelar</button>
              <button onClick={()=>confirmar(d)} style={{flex:2,padding:"10px",border:"none",borderRadius:10,background:"#2e7d32",color:"#fff",cursor:"pointer",fontWeight:700}}>Confirmar pagamento</button>
            </div>
          </div>)}
        </div>);})}
    </div>
    {!resumo&&(<div style={card}>
      <Tit>+ Nova conta principal</Tit>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr",gap:10}} className="grid2">
        <Fi label="Nome" value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex: Aluguel"/>
        <Fi label="Valor R$" type="number" value={valor} onChange={e=>setValor(e.target.value)} inputMode="decimal"/>
        <Fi label="Dia venc." type="number" value={dia} onChange={e=>setDia(e.target.value)} inputMode="numeric" min="1" max="31"/>
      </div>
      <div style={{marginTop:12}}><Btn onClick={add} label="+ Adicionar" full/></div>
      <p style={{margin:"10px 0 0",fontSize:12,color:"#888"}}>Essas contas aparecem todo mes. Ao clicar em Pagar, a saida entra no extrato automaticamente.</p>
    </div>)}
  </div>);}

function Contas({contas,lancs,onSalvar}){
  const[nome,setNome]=useState("");const[ini,setIni]=useState("");
  const[editId,setEditId]=useState(null);const[en,setEn]=useState("");const[ei,setEi]=useState("");
  const add=()=>{if(!nome){alert("Informe o nome da conta.");return;}onSalvar([...contas,{id:uid(),nome,saldoInicial:Number(ini||0)}]);setNome("");setIni("");};
  const salvarEd=()=>{if(!en)return;onSalvar(contas.map(c=>c.id===editId?{...c,nome:en,saldoInicial:Number(ei||0)}:c));setEditId(null);};
  const rem=c=>{if(lancs.some(l=>l.contaId===c.id||l.contaDestinoId===c.id)){alert("Esta conta tem lancamentos e nao pode ser removida.");return;}if(confirm("Remover a conta \""+c.nome+"\"?"))onSalvar(contas.filter(x=>x.id!==c.id));};
  return(<div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{...card,padding:0,overflow:"hidden"}}>
      <p style={{margin:0,padding:"14px 16px",fontWeight:700,fontSize:14,borderBottom:"1px solid #eee"}}>Onde esta o dinheiro</p>
      {contas.map(c=>(<div key={c.id} style={{padding:"12px 16px",borderBottom:"1px solid #f5f5f5"}}>
        {editId===c.id?(<div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:8}} className="grid2">
          <Fi label="Nome" value={en} onChange={e=>setEn(e.target.value)}/>
          <Fi label="Saldo inicial R$" type="number" value={ei} onChange={e=>setEi(e.target.value)} inputMode="decimal"/>
          <div style={{gridColumn:"1/-1",display:"flex",gap:8}}>
            <button onClick={()=>setEditId(null)} style={{flex:1,padding:"10px",border:"1.5px solid #ddd",borderRadius:10,background:"#fff",cursor:"pointer",fontWeight:600}}>Cancelar</button>
            <button onClick={salvarEd} style={{flex:2,padding:"10px",border:"none",borderRadius:10,background:"#c62828",color:"#fff",cursor:"pointer",fontWeight:700}}>Salvar</button>
          </div></div>)
        :(<div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:20}}>🏦</span>
          <div style={{flex:1,minWidth:0}}><p style={{margin:0,fontSize:14,fontWeight:600}}>{c.nome}</p><p style={{margin:0,fontSize:12,color:"#aaa"}}>Saldo inicial {fm(c.saldoInicial)}</p></div>
          <span style={{fontWeight:800,fontSize:15,color:saldoConta(c,lancs)>=0?"#1565c0":"#c62828",whiteSpace:"nowrap"}}>{fm(saldoConta(c,lancs))}</span>
          <button onClick={()=>{setEditId(c.id);setEn(c.nome);setEi(String(c.saldoInicial||0));}} style={{border:"none",background:"none",cursor:"pointer",fontSize:16,padding:"4px 6px"}}>✏️</button>
          <button onClick={()=>rem(c)} style={{border:"none",background:"none",color:"#ccc",cursor:"pointer",fontSize:20,padding:"4px 6px"}}>✕</button>
        </div>)}
      </div>))}
    </div>
    <div style={card}>
      <Tit>+ Nova conta</Tit>
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr",gap:10}} className="grid2">
        <Fi label="Nome" value={nome} onChange={e=>setNome(e.target.value)} placeholder="Ex: Banco Itau, Nubank"/>
        <Fi label="Saldo atual R$" type="number" value={ini} onChange={e=>setIni(e.target.value)} inputMode="decimal"/>
      </div>
      <div style={{marginTop:12}}><Btn onClick={add} label="+ Adicionar conta" full/></div>
      <p style={{margin:"10px 0 0",fontSize:12,color:"#888"}}>Coloque o saldo de hoje. A partir dai, cada entrada, saida ou transferencia atualiza o saldo.</p>
    </div>
  </div>);}

function App(){
  const[usuario,setUsuario]=useState(null);const[checando,setChecando]=useState(true);
  const carregarPerfil=async()=>{const{data:{session}}=await SB.auth.getSession();if(!session){setUsuario(null);setChecando(false);return;}const{data}=await SB.from("perfis").select("nome,role").eq("id",session.user.id).maybeSingle();if(!data||data.role!=="master"){if(!data)await SB.auth.signOut();alert("Acesso apenas para master.");setUsuario(null);}else setUsuario(data);setChecando(false);};
  useEffect(()=>{carregarPerfil();},[]);
  const[dados,setDados]=useState(null);const[erro,setErro]=useState(null);const[salv,setSalv]=useState(false);
  const[tela,setTela]=useState("resumo");const[mes,setMes]=useState(mesAtual());
  useEffect(()=>{if(!usuario)return;ler().then(setDados).catch(()=>setErro("Erro ao conectar."));},[usuario]);
  const salvar=async mut=>{setSalv(true);try{const atual=await ler();const n=mut(atual);await gravar(n);setDados(n);}catch{alert("Erro ao salvar. Verifique a internet e tente de novo.");}setSalv(false);};
  const addLanc=l=>salvar(d=>({...d,lancamentos:[...d.lancamentos,l]}));
  const remLanc=id=>salvar(d=>({...d,lancamentos:d.lancamentos.filter(x=>x.id!==id)}));
  const setDesp=lista=>salvar(d=>({...d,despesas:lista}));
  const setContas=lista=>salvar(d=>({...d,contas:lista}));

  if(checando)return(<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh"}}><p style={{color:"#c62828",fontWeight:700,fontSize:17}}>Carregando...</p></div>);
  if(!usuario)return<Login onLogin={carregarPerfil}/>;
  if(erro)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:14,padding:24,textAlign:"center"}}><span style={{fontSize:48}}>⚠️</span><p style={{color:"#c62828",fontWeight:700}}>{erro}</p><Btn onClick={()=>window.location.reload()} label="Tentar novamente"/></div>);
  if(!dados)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:14}}><span style={{fontSize:48}}>💵</span><p style={{color:"#c62828",fontWeight:700,fontSize:17}}>Carregando...</p></div>);

  const{contas,lancamentos,despesas}=dados;
  const doMes=lancamentos.filter(l=>(l.data||"").startsWith(mes)).sort((a,b)=>b.data.localeCompare(a.data));
  const en=doMes.filter(l=>l.tipo==="Entrada").reduce((s,l)=>s+Number(l.valor),0);
  const sa=doMes.filter(l=>l.tipo==="Saida").reduce((s,l)=>s+Number(l.valor),0);
  const saldoTotal=contas.reduce((s,c)=>s+saldoConta(c,lancamentos),0);
  const NV=[{id:"resumo",icon:"📊",label:"Resumo"},{id:"lancar",icon:"➕",label:"Lancar"},{id:"despesas",icon:"🧾",label:"Contas fixas"},{id:"contas",icon:"🏦",label:"Caixa e bancos"}];

  return(<div style={{fontFamily:"system-ui,-apple-system,sans-serif",background:"#f7f7f7",minHeight:"100vh"}}>
    <div style={{background:"#c62828",color:"#fff",padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:56,boxShadow:"0 2px 8px #0003",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:24}}>💵</span><div><p style={{margin:0,fontWeight:900,fontSize:17,lineHeight:1}}>PTK FINANCEIRO</p><p style={{margin:0,fontSize:10,opacity:.8,lineHeight:1.2}}>{salv?"💾 Salvando...":usuario.nome}</p></div></div>
      <div style={{display:"flex",gap:8}}>
        <a href="./" style={{background:"rgba(255,255,255,0.2)",color:"#fff",borderRadius:10,padding:"7px 12px",fontSize:12,fontWeight:600,textDecoration:"none"}}>🏍️ Sistema</a>
        <button onClick={async()=>{await SB.auth.signOut();setUsuario(null);setDados(null);}} style={{background:"rgba(255,255,255,0.15)",color:"#fff",border:"none",borderRadius:10,padding:"7px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}>Sair</button>
      </div>
    </div>
    <div style={{background:"#fff",borderBottom:"1.5px solid #eee",display:"flex",position:"sticky",top:56,zIndex:99}}>
      {NV.map(n=>(<button key={n.id} onClick={()=>setTela(n.id)} style={{flex:1,background:"none",border:"none",padding:"10px 4px 8px",cursor:"pointer",fontSize:11,fontWeight:600,whiteSpace:"nowrap",color:tela===n.id?"#c62828":"#888",borderBottom:tela===n.id?"2.5px solid #c62828":"2.5px solid transparent"}}>
        <span style={{fontSize:18,display:"block",marginBottom:2}}>{n.icon}</span>{n.label}</button>))}
    </div>
    <div style={{maxWidth:900,margin:"0 auto",padding:"16px 14px 80px",display:"flex",flexDirection:"column",gap:14}}>
      {tela!=="contas"&&(<div style={{...card,padding:10,display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <button onClick={()=>setMes(mesSoma(mes,-1))} style={{border:"none",background:"#f5f5f5",borderRadius:8,padding:"8px 14px",cursor:"pointer",fontSize:16,fontWeight:700}}>‹</button>
        <span style={{fontWeight:700,fontSize:15}}>{mesNome(mes)}</span>
        <button onClick={()=>setMes(mesSoma(mes,1))} style={{border:"none",background:"#f5f5f5",borderRadius:8,padding:"8px 14px",cursor:"pointer",fontSize:16,fontWeight:700}}>›</button>
      </div>)}
      {tela==="resumo"&&(<>
        <div style={{...card,background:"#c62828",border:"none",color:"#fff"}}>
          <p style={{margin:0,fontSize:11,fontWeight:700,opacity:.85,textTransform:"uppercase"}}>Saldo total hoje</p>
          <p style={{margin:"6px 0 10px",fontSize:28,fontWeight:900}}>{fm(saldoTotal)}</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:8}}>{contas.map(c=>(<span key={c.id} style={{background:"rgba(255,255,255,0.18)",borderRadius:20,padding:"4px 10px",fontSize:12,fontWeight:600}}>{c.nome}: {fm(saldoConta(c,lancamentos))}</span>))}</div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}} className="grid3">
          {[["Entradas",en,"#2e7d32"],["Saidas",sa,"#b71c1c"],["Resultado",en-sa,(en-sa)>=0?"#1565c0":"#b71c1c"]].map(([l,v,c])=>(<div key={l} style={{...card,padding:14}}><p style={{margin:0,fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase"}}>{l} do mes</p><p style={{margin:"6px 0 0",fontSize:18,fontWeight:900,color:c}}>{fm(v)}</p></div>))}
        </div>
        <Despesas despesas={despesas} lancs={lancamentos} contas={contas} mes={mes} onPagar={addLanc} onSalvar={setDesp} resumo/>
        <Extrato lancs={doMes} contas={contas} onRem={remLanc}/>
      </>)}
      {tela==="lancar"&&(<>
        {contas.length===0?<div style={card}><p style={{fontSize:14}}>Cadastre primeiro uma conta em "Caixa e bancos".</p></div>:<NovoLanc contas={contas} onAdd={addLanc}/>}
        <Extrato lancs={doMes} contas={contas} onRem={remLanc}/>
      </>)}
      {tela==="despesas"&&<Despesas despesas={despesas} lancs={lancamentos} contas={contas} mes={mes} onPagar={addLanc} onSalvar={setDesp}/>}
      {tela==="contas"&&<Contas contas={contas} lancs={lancamentos} onSalvar={setContas}/>}
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
