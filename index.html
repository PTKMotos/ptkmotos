function BarraMeta({atual,meta,formato,inverso}){

  const fmt=v=>formato==="moeda"?fm(v):formato==="pct"?fp(v):formato==="dias"?Math.round(v)+"d":String(Math.round(v));
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
      <span style={{fontSize:13,fontWeight:800,color:cor}}>{fmt(atual)}</span>
      <span style={{fontSize:12,color:"#aaa"}}>/ {fmt(meta)}</span>
    </div>
    <div style={{background:"#f0f0f0",borderRadius:20,height:12,overflow:"hidden",position:"relative"}}>
      <div style={{position:"absolute",left:ritmo+"%",top:0,bottom:0,width:2,background:"#888",zIndex:2}}/>
      <div style={{width:pct+"%",height:"100%",background:cor,borderRadius:20}}/>
    </div>

  </div>);}

          <Fi label="Preco de Venda R$" type="number" value={simPV} onChange={e=>setSimPV(e.target.value)} inputMode="decimal"/>
          <div style={{marginTop:8}}><Fi label="Margem %" type="number" value={simM} onChange={e=>setSimM(e.target.value)} inputMode="decimal"/></div>
          {maxPagar&&(<div style={{marginTop:10,background:"#1565c0",borderRadius:10,padding:"12px",textAlign:"center"}}>
            <p style={{margin:0,fontSize:11,color:"rgba(255,255,255,0.8)"}}>CUSTO MAXIMO</p>
            <p style={{margin:"4px 0 0",fontWeight:900,fontSize:22,color:"#fff"}}>{fm(maxPagar)}</p>
            <p style={{margin:"2px 0 0",fontSize:11,color:"rgba(255,255,255,0.7)"}}>Lucro: {fm(Number(simPV)-maxPagar)}</p>
          </div>)}
        </div>
        <div style={{background:"#f1f8e9",borderRadius:12,padding:14}}>
          <p style={{margin:"0 0 10px",fontWeight:700,fontSize:13,color:"#2e7d32"}}>Quanto devo vender?</p>
          <Fi label="Custo Total R$" type="number" value={simC} onChange={e=>setSimC(e.target.value)} inputMode="decimal"/>
          <div style={{marginTop:8}}><Fi label="Margem %" type="number" value={simMi} onChange={e=>setSimMi(e.target.value)} inputMode="decimal"/></div>
          {minVender&&(<div style={{marginTop:10,background:"#2e7d32",borderRadius:10,padding:"12px",textAlign:"center"}}>
            <p style={{margin:0,fontSize:11,color:"rgba(255,255,255,0.8)"}}>PRECO MINIMO</p>
            <p style={{margin:"4px 0 0",fontWeight:900,fontSize:22,color:"#fff"}}>{fm(minVender)}</p>
            <p style={{margin:"2px 0 0",fontSize:11,color:"rgba(255,255,255,0.7)"}}>Lucro: {fm(minVender-Number(simC))}</p>
          </div>)}
        </div>
      </div>
    </div>
    {historico.length>0&&(<div style={{background:"#fff",border:"1.5px solid #eee",borderRadius:14,padding:16}}>
      <p style={{margin:"0 0 12px",fontWeight:700,fontSize:14}}>📅 Historico de Metas</p>
      {historico.map(h=>(<div key={h.mes} style={{padding:"10px 0",borderBottom:"1px solid #f5f5f5"}}>
        <p style={{margin:"0 0 6px",fontWeight:700,fontSize:13,color:"#555"}}>{mesNome(h.mes)}</p>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}} className="grid3">
          {[["Fat.",h.dados.faturamento,"moeda"],["Lucro",h.dados.lucro,"moeda"],["Motos",h.dados.qtdVendas,"qtd"]].map(([l,v,f])=>(<div key={l} style={{background:"#f9f9f9",borderRadius:8,padding:"8px 10px"}}><p style={{margin:0,fontSize:10,color:"#aaa"}}>{l}</p><p style={{margin:"2px 0 0",fontWeight:700,fontSize:13}}>{f==="moeda"?fm(v):v||"—"}</p></div>))}
        </div>
      </div>))}
    </div>)}
  </div>);}
