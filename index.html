function BarraMeta({atual,meta,formato,inverso}){
  const pct=meta>0?Math.min(100,(atual/meta)*100):0;
  const ritmo=(diaAtual()/diasNoMes())*100;
  const naFrente=inverso?(pct<=ritmo):(pct>=ritmo);
  const cor=pct>=100?"#2e7d32":naFrente?"#43a047":"#f57f17";
  const fmt=v=>formato==="moeda"?fm(v):formato==="pct"?fp(v):formato==="dias"?Math.round(v)+"d":String(Math.round(v));
  return(<div>
    <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
      <span style={{fontSize:13,fontWeight:800,color:cor}}>{fmt(atual)}</span>
      <span style={{fontSize:12,color:"#aaa"}}>/ {fmt(meta)}</span>
    </div>
    <div style={{background:"#f0f0f0",borderRadius:20,height:12,overflow:"hidden",position:"relative"}}>
      <div style={{position:"absolute",left:ritmo+"%",top:0,bottom:0,width:2,background:"#888",zIndex:2}}/>
      <div style={{width:pct+"%",height:"100%",background:cor,borderRadius:20}}/>
    </div>
    <div style={{display:"flex",justifyContent:"space-between",marginTop:3}}>
      <span style={{fontSize:11,color:naFrente?"#2e7d32":"#e65100",fontWeight:600}}>{naFrente?"✓ No ritmo":"⚠ Abaixo"} ({fp(pct)})</span>
      <span style={{fontSize:11,color:"#aaa"}}>Esperado: {fp(ritmo)}</span>

    const marcasV={};vendidas.forEach(m=>{if(!marcasV[m.marca])marcasV[m.marca]=[];marcasV[m.marca].push(m);});
    const topMarca=Object.entries(marcasV).sort((a,b)=>b[1].length-a[1].length)[0];
    const prompt="Voce e um consultor especialista em revendas de motos usadas no Brasil. Analise os dados da PTK Motos e gere sugestoes praticas para cada moto no estoque.\n\nHISTORICO:\n- Motos vendidas: "+vendidas.length+"\n- Tempo medio: "+md+" dias\n- Marca mais vendida: "+(topMarca?topMarca[0]+" ("+topMarca[1].length+" vendas)":"sem dados")+"\n- Margem media: "+(vendidas.length?fp(vendidas.reduce((s,m)=>s+margemRealPct(m),0)/vendidas.length):"sem dados")+"\n\nESTOQUE ("+estoque.length+" motos):\n"+estoque.map(m=>"- "+m.marca+" "+m.modelo+" "+m.placa+": custo "+fm(custoTotal(m))+", preco "+fm(m.precoVenda||0)+", margem "+fp(margemEspPct(m))+", "+(diasNoEstoque(m)!==null?diasNoEstoque(m)+" dias":"sem data")+", entrada: "+(m.tipoEntrada||"Compra")).join("\n")+"\n\nPara cada moto gere UMA sugestao pratica. Responda APENAS JSON:\n[{\"placa\":\"XXX\",\"moto\":\"Marca Modelo\",\"sugestao\":\"texto\",\"urgencia\":\"alta|media|baixa\"}]";
    try{const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages:[{role:"user",content:prompt}]})});const data=await res.json();const txt=data.content?.map(x=>x.text||"").join("").trim();setSugestoes(JSON.parse(txt.replace(/```json|```/g,"").trim()));setGerado(true);}
    catch(e){setSugestoes([{placa:"—",moto:"Erro",sugestao:"Nao foi possivel gerar sugestoes.",urgencia:"baixa"}]);setGerado(true);}
    setLoading(false);};
  const corU={alta:"#b71c1c",media:"#f57f17",baixa:"#2e7d32"};const bgU={alta:"#fce4ec",media:"#fff8e1",baixa:"#e8f5e9"};
  return(<div style={{display:"flex",flexDirection:"column",gap:14}}>
    <div style={{background:"#fff",border:"1.5px solid #eee",borderRadius:14,padding:20}}>

      <Btn onClick={analisar} label={loading?"Analisando...":"🔍 Analisar e gerar sugestoes"} full disabled={loading}/>
    </div>
    {gerado&&(<div style={{display:"flex",flexDirection:"column",gap:10}}>
      {sugestoes.map((s,i)=>(<div key={i} style={{background:bgU[s.urgencia]||"#f9f9f9",border:"1.5px solid "+(corU[s.urgencia]||"#eee")+"55",borderRadius:14,padding:16}}>

          <span style={{fontSize:11,fontWeight:700,padding:"4px 10px",borderRadius:10,background:corU[s.urgencia]||"#888",color:"#fff",whiteSpace:"nowrap",marginLeft:8}}>{(s.urgencia||"").toUpperCase()}</span>
        </div>
        <p style={{margin:0,fontSize:14,color:"#333",lineHeight:1.6}}>{s.sugestao}</p>
      </div>))}
    </div>)}
  </div>);}

          <button onClick={()=>setForm({...l})} style={{padding:"7px 10px",border:"1.5px solid #ddd",borderRadius:10,background:"#fff",cursor:"pointer",fontSize:12,fontWeight:600}}>✏️</button>
          {l.etapa!=="Fechado"&&l.etapa!=="Perdido"&&<button onClick={()=>avancar(l.id)} style={{padding:"7px 10px",border:"none",background:"#e8f5e9",color:"#2e7d32",borderRadius:10,cursor:"pointer",fontSize:12,fontWeight:700}}>→</button>}
          <button onClick={()=>rm(l.id)} style={{padding:"7px 10px",border:"none",background:"#fce4ec",color:"#c62828",borderRadius:10,cursor:"pointer",fontSize:12,fontWeight:600}}>🗑️</button>
        </div>
      </div>
      {l.telefone&&(<a href={"https://wa.me/55"+l.telefone.replace(/\D/g,"")} target="_blank" style={{display:"block",marginTop:10,padding:"8px",background:"#25d366",color:"#fff",borderRadius:10,textDecoration:"none",textAlign:"center",fontWeight:700,fontSize:13}}>💬 WhatsApp</a>)}
    </div>))}
  </div>);}function App(){
  const[usuario,setUsuario]=useState(null);const[checando,setChecando]=useState(true);
  const[motos,setMotos]=useState([]);const[fin,setFin]=useState([]);const[contas,setContas]=useState([]);
  const[pessoas,setPessoas]=useState([]);const[empresas,setEmpresas]=useState([]);const[leads,setLeads]=useState([]);
  const[tela,setTela]=useState("dashboard");const[edit,setEdit]=useState(null);
  const[busca,setBusca]=useState("");const[fst,setFst]=useState("Todos");
  const[load,setLoad]=useState(true);const[salv,setSalv]=useState(false);const[erro,setErro]=useState(null);
  const isMaster=usuario?.role==="master";
  const carregarPerfil=async()=>{const{data:{session}}=await SB.auth.getSession();if(!session){setUsuario(null);setChecando(false);return;}const{data}=await SB.from("perfis").select("nome,role").eq("id",session.user.id).maybeSingle();if(!data){await SB.auth.signOut();alert("Este usuario ainda nao tem acesso ao sistema.");setUsuario(null);}else{setLoad(true);setUsuario(data);}setChecando(false);};
  useEffect(()=>{carregarPerfil();},[]);
  const sair=async()=>{await SB.auth.signOut();setUsuario(null);};
  const baixarBackup=async()=>{const{data,error}=await SB.from("colecoes").select("nome,dados,atualizado_em");if(error){alert("Erro ao gerar backup.");return;}const b=new Blob([JSON.stringify({gerado_em:new Date().toISOString(),colecoes:data},null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="PTK_backup_"+td()+".json";a.click();};

  useEffect(()=>{if(!usuario)return;async function init(){try{
    const[m,f,c,p,e,l]=await Promise.all([rb(BM),rb(BF),rb(BC),rb(BP),rb(BE),rb(BL)]);
    setMotos(m);setFin(f);setContas(c);setPessoas(p);setEmpresas(e);setLeads(l);
  }catch(er){setErro("Erro ao conectar.");}finally{setLoad(false);}}init();},[usuario]);

  const sm=async n=>{setSalv(true);setMotos(n);try{await wb(BM,n);}catch{alert("Erro ao salvar.");}setSalv(false);};
  const sf=async n=>{setSalv(true);setFin(n);try{await wb(BF,n);}catch{alert("Erro ao salvar.");}setSalv(false);};
  const sc=async n=>{setSalv(true);setContas(n);try{await wb(BC,n);}catch{alert("Erro ao salvar.");}setSalv(false);};
  const sp=async n=>{setSalv(true);setPessoas(n);try{await wb(BP,n);}catch{alert("Erro ao salvar.");}setSalv(false);};
  const se=async n=>{setSalv(true);setEmpresas(n);try{await wb(BE,n);}catch{alert("Erro ao salvar.");}setSalv(false);};
  const sl=async n=>{setSalv(true);setLeads(n);try{await wb(BL,n);}catch{alert("Erro ao salvar.");}setSalv(false);};
  const savMoto=async m=>{const n=edit?motos.map(x=>x.id===m.id?m:x):[...motos,m];await sm(n);setTela("estoque");setEdit(null);};
  const delMoto=async id=>{if(!confirm("Remover esta moto?"))return;await sm(motos.filter(m=>m.id!==id));setTela("estoque");setEdit(null);};

  const onVerMoto=(moto)=>{setEdit(moto);setTela("editar");};

  const totalCE=motos.filter(m=>m.status!=="Vendida").reduce((s,m)=>s+custoTotal(m),0);
  const mf=motos.filter(m=>{const q=busca.toLowerCase();const ok=!q||[m.marca,m.modelo,m.placa,m.vendedorNome,m.compradorNome].some(v=>(v||"").toLowerCase().includes(q));return ok&&(fst==="Todos"||m.status===fst);});
  const mes=mesAtual();
  const contasMes=contas.filter(c=>c.mes===mes);
  const cVenc=contasMes.filter(c=>!c.pago&&c.vencimento&&c.vencimento<td());
  const cVenc7=contasMes.filter(c=>{const d=diasAteVencer(c);return d!==null&&d>=0&&d<=7;});
  const badgeContas=isMaster?(cVenc.length+cVenc7.length):0;
  const urgentesMotos=motos.filter(m=>semaforo(m)==="red").length;
  const leadsAtivos=leads.filter(l=>l.etapa!=="Fechado"&&l.etapa!=="Perdido").length;

  const NV=[
    {id:"dashboard",icon:"📊",label:"Painel",badge:isMaster?urgentesMotos+badgeContas:urgentesMotos,show:true},
    {id:"estoque",icon:"🏍️",label:"Estoque",badge:urgentesMotos,show:true},
    {id:"metas",icon:"🎯",label:"Metas",badge:0,show:true},
    {id:"contas",icon:"🧾",label:"Contas",badge:badgeContas,show:isMaster},
    {id:"financeiro",icon:"💰",label:"Financeiro",badge:0,show:true},
    {id:"relatorios",icon:"📈",label:"Relat.",badge:0,show:true},
    {id:"leads",icon:"🎯",label:"Leads",badge:leadsAtivos,show:true},
    {id:"pessoas",icon:"👥",label:"Pessoas",badge:0,show:isMaster},
    {id:"empresas",icon:"🏢",label:"Empresas",badge:0,show:isMaster},
    {id:"ia",icon:"🤖",label:"IA",badge:0,show:true}
  ].filter(n=>n.show);

  if(checando)return(<div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh"}}><p style={{color:"#c62828",fontWeight:700,fontSize:17}}>Carregando...</p></div>);
  if(!usuario)return<Login onLogin={carregarPerfil}/>;
  if(load)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:14}}><span style={{fontSize:48}}>🏍️</span><p style={{color:"#c62828",fontWeight:700,fontSize:17}}>Carregando...</p></div>);
  if(erro)return(<div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:14,padding:24,textAlign:"center"}}><span style={{fontSize:48}}>⚠️</span><p style={{color:"#c62828",fontWeight:700}}>{erro}</p><Btn onClick={()=>window.location.reload()} label="Tentar novamente"/></div>);

  return(<div style={{fontFamily:"system-ui,-apple-system,sans-serif",background:"#f7f7f7",minHeight:"100vh"}}>
    <div style={{background:"#c62828",color:"#fff",padding:"0 16px",display:"flex",alignItems:"center",justifyContent:"space-between",height:56,boxShadow:"0 2px 8px #0003",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:24}}>🏍️</span><div><p style={{margin:0,fontWeight:900,fontSize:17,lineHeight:1}}>PTK MOTOS</p><p style={{margin:0,fontSize:10,opacity:.8,lineHeight:1.2}}>{salv?"💾 Salvando...":usuario.nome+" · "+(isMaster?"Master":"Vendas")}</p></div></div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        {["dashboard","estoque"].includes(tela)&&<button onClick={()=>{setEdit(null);setTela("nova");}} style={{background:"#fff",color:"#c62828",border:"none",borderRadius:10,padding:"7px 14px",fontWeight:700,cursor:"pointer",fontSize:13}}>+ Moto</button>}
        {["nova","editar"].includes(tela)&&<button onClick={()=>{setTela("estoque");setEdit(null);}} style={{background:"rgba(255,255,255,0.2)",color:"#fff",border:"none",borderRadius:10,padding:"7px 14px",cursor:"pointer",fontSize:13,fontWeight:600}}>Voltar</button>}
        {isMaster&&<a href="financeiro.html" style={{background:"#fff",color:"#2e7d32",borderRadius:10,padding:"7px 12px",fontWeight:700,fontSize:13,textDecoration:"none"}}>💵 Caixa</a>}
        {isMaster&&<button onClick={baixarBackup} title="Baixar backup" style={{background:"rgba(255,255,255,0.15)",color:"#fff",border:"none",borderRadius:10,padding:"7px 10px",cursor:"pointer",fontSize:14}}>💾</button>}
        <button onClick={sair} style={{background:"rgba(255,255,255,0.15)",color:"#fff",border:"none",borderRadius:10,padding:"7px 12px",cursor:"pointer",fontSize:12,fontWeight:600}}>Sair</button>
      </div>
    </div>

    <div style={{background:"#fff",borderBottom:"1.5px solid #eee",display:"flex",position:"sticky",top:56,zIndex:99,overflowX:"auto"}}>
      {NV.map(n=>(<button key={n.id} onClick={()=>setTela(n.id)} style={{flex:1,minWidth:52,background:"none",border:"none",padding:"10px 4px 8px",cursor:"pointer",fontSize:11,fontWeight:600,whiteSpace:"nowrap",color:tela===n.id?"#c62828":"#888",borderBottom:tela===n.id?"2.5px solid #c62828":"2.5px solid transparent",position:"relative"}}>
        <span style={{fontSize:18,display:"block",marginBottom:2}}>{n.icon}</span>{n.label}
        {n.badge>0&&<span style={{position:"absolute",top:6,right:"calc(50% - 16px)",background:"#e53935",color:"#fff",borderRadius:"50%",width:16,height:16,fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center"}}>{n.badge>9?"9+":n.badge}</span>}
      </button>))}
    </div>

    <div style={{maxWidth:900,margin:"0 auto",padding:"16px 14px 80px"}}>
      {tela==="dashboard"&&<Db motos={motos} contas={contas} usuario={usuario} onVerMoto={onVerMoto}/>}
      {tela==="estoque"&&(<div style={{display:"flex",flexDirection:"column",gap:12}}>
        <div style={{display:"flex",gap:8}}>
          <input value={busca} onChange={e=>setBusca(e.target.value)} placeholder="🔍 Buscar marca, placa, nome..." style={{flex:1,border:"1.5px solid #ddd",borderRadius:12,padding:"11px 14px",fontSize:15,outline:"none",background:"#fff"}}/>
          <select value={fst} onChange={e=>setFst(e.target.value)} style={{border:"1.5px solid #ddd",borderRadius:12,padding:"11px 12px",fontSize:14,background:"#fff",outline:"none",WebkitAppearance:"none"}}>
            <option>Todos</option>{Object.keys(SC).map(s=><option key={s}>{s}</option>)}
          </select>
        </div>
        {mf.length===0?<div style={{textAlign:"center",padding:"50px 0",color:"#aaa"}}><p style={{fontSize:48}}>🏍️</p><p style={{fontWeight:600,fontSize:15,marginTop:8}}>{busca?"Nenhuma moto encontrada":"Nenhuma moto cadastrada ainda"}</p></div>
        :<div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>{mf.map(m=><Mc key={m.id} moto={m} onClick={isMaster?()=>{setEdit(m);setTela("editar");}:undefined} totalCustoEstoque={totalCE} usuario={usuario}/>)}</div>}
      </div>)}
      {tela==="metas"&&<Metas motos={motos} contas={contas} isMaster={isMaster}/>}
      {tela==="contas"&&isMaster&&<Co contas={contas} onSave={sc} empresas={empresas}/>}
      {tela==="financeiro"&&<Fn motos={motos} financeiro={fin} onAdd={async i=>await sf([...fin,i])} onRem={async id=>await sf(fin.filter(f=>f.id!==id))} usuario={usuario}/>}
      {tela==="relatorios"&&<Rl motos={motos} usuario={usuario}/>}
      {tela==="leads"&&<Leads leads={leads} onSave={sl} pessoas={pessoas}/>}
      {tela==="pessoas"&&isMaster&&<Pessoas pessoas={pessoas} onSave={sp}/>}
      {tela==="empresas"&&isMaster&&<Empresas empresas={empresas} onSave={se}/>}
      {tela==="ia"&&<Ia motos={motos}/>}
      {tela==="nova"&&(<div style={{background:"#fff",borderRadius:16,padding:20,border:"1.5px solid #eee"}}>
        <h2 style={{margin:"0 0 20px",fontSize:19}}>🏍️ Cadastrar Nova Moto</h2>
        <Mf onSave={savMoto} onCancel={()=>setTela("estoque")} usuario={usuario} pessoas={pessoas}/>
      </div>)}
      {tela==="editar"&&edit&&isMaster&&(<div style={{background:"#fff",borderRadius:16,padding:20,border:"1.5px solid #eee"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
          <h2 style={{margin:0,fontSize:18,flex:1,marginRight:10}}>{edit.marca} {edit.modelo}<br/><span style={{fontSize:13,color:"#888",fontWeight:400}}>{edit.placa}</span></h2>
          <button onClick={()=>delMoto(edit.id)} style={{background:"#fce4ec",color:"#c62828",border:"none",borderRadius:10,padding:"8px 14px",cursor:"pointer",fontSize:13,fontWeight:700}}>🗑️ Remover</button>
        </div>
        <Mf initial={edit} onSave={savMoto} onCancel={()=>{setTela("estoque");setEdit(null);}} usuario={usuario} pessoas={pessoas}/>
      </div>)}
    </div>
  </div>);}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
